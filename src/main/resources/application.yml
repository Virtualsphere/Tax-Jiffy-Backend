server:
  port: 7071
  forward-headers-strategy: framework

spring:
  config:
    # Whitebooks API keys live in this gitignored file (see application-secrets.yml.example).
    # Values there override this file; server environment variables override both.
    import: optional:classpath:application-secrets.yml
  datasource:
    url: jdbc:mysql://localhost:3306/gst_reconciliation_system
    username: root
    password: Taxjiffy@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true

jwt:
  secret: 49827016d37870f03fa2bb5d391ab441ba7057ec3412ce6dca12c3f7baf61db5
  expiration-ms: 86400000

# Whitebooks. Keys come from the Developer Hub -> API Keys, one pair per product.
# GST_API_BASE_URL: https://apisandbox.whitebooks.in (sandbox) or the production host from Whitebooks.
gst:
  api:
    email: ${GST_API_EMAIL:taxjiffy@gmail.com}
    ip-address: ${GST_API_IP_ADDRESS:49.37.135.42}
    base-url: ${GST_API_BASE_URL:https://apisandbox.whitebooks.in}
    client-id: ${GST_CLIENT_ID:}
    client-secret: ${GST_CLIENT_SECRET:}
    session-minutes: 360
    einvoice-base-url: ${gst.api.base-url}/gst/einvoice
    ims-base-url: ${gst.api.base-url}/ims
    ewaybill-base-url: ${EWB_API_BASE_URL:https://apisandbox.whitebooks.in}/ewaybillapi/v1.03/ewayapi
    ewaybill-client-id: ${EWB_CLIENT_ID:}
    ewaybill-client-secret: ${EWB_CLIENT_SECRET:}

app:
  excel:
    upload-dir: /srv/taxjiffy/uploads/excel
  upload:
    dir: /srv/taxjiffy/uploads/photos
    base-url: https://api.taxjiffy.com/uploads/photos